version: 2

updates:
  # Root npm workspace, including javascript/package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Copenhagen"

    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Python/uv projects
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/python"
      - "/webhook-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Copenhagen"

    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  # Actions used in ci.yml, tests.yml, release.yml and pages.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Copenhagen"

    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
