name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed clients
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.detect.outputs.javascript }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            changed=$(git ls-files)
          elif [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA...HEAD")
          else
            changed=$(git diff --name-only "$BEFORE" HEAD)
          fi
          grep -qE '^javascript/' <<<"$changed" && js=true || js=false
          grep -qE '^(python/|webhook-server/)' <<<"$changed" && py=true || py=false
          echo "javascript=$js" >> "$GITHUB_OUTPUT"
          echo "python=$py" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: changes
    uses: ./.github/workflows/tests.yml
    with:
      run-javascript: ${{ needs.changes.outputs.javascript == 'true' }}
      run-python: ${{ needs.changes.outputs.python == 'true' }}

  # A changeset is required whenever javascript/ or python/dalux_build (the
  # published code) changes, since both packages release together (see
  # scripts/sync-python-version.mjs). This is a plain git-diff check rather
  # than `npx changeset status`, because Changesets is workspace-scoped to
  # javascript/ only and would silently miss python-only changes that still
  # need a release. See CONTRIBUTING.md.
  changeset-check:
    name: Changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if ! echo "$CHANGED" | grep -qE '^(javascript/(src|package\.json)|python/(dalux_build|pyproject\.toml))'; then
            echo "No published code changed, no changeset required."
            exit 0
          fi
          if echo "$CHANGED" | grep -qE '^\.changeset/.+\.md$'; then
            echo "Changeset found."
            exit 0
          fi
          echo "::error::javascript/ or python/ changed without a changeset. Run 'npx changeset' (or 'npx changeset add --empty' if this change doesn't need a release). See CONTRIBUTING.md."
          exit 1

  # `changeset-check` above only proves a changeset *exists*; it says nothing
  # about whether it names a real package. A changeset naming a non-workspace
  # package passes every PR check and then aborts `changeset version` on push
  # to main, silently blocking the release (see scripts/validate-changesets.mjs).
  # Runs on push as well as PRs, since changesets can land on main directly.
  changeset-validate:
    name: Changesets name valid packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Uses only Node builtins, so no `npm ci` needed.
      - run: node scripts/validate-changesets.mjs
