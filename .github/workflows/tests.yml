# Reusable test suite — not directly triggerable. Called by ci.yml (PR/push
# gate) and release.yml (publish gate), so there is one source of truth for
# what "tests pass" means and neither workflow can drift from the other.

name: Tests (reusable)

on:
  workflow_call:
    inputs:
      run-javascript:
        description: Run JavaScript tests
        required: false
        type: boolean
        default: true
      run-python:
        description: Run Python tests
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test-js:
    if: inputs.run-javascript
    name: Test Node.js (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test --workspace=javascript

  test-python:
    if: inputs.run-python
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python

    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,webhook]"

      - name: Run tests
        run: pytest --cov=dalux_build --cov-report=term-missing

  ruff-python:
    if: inputs.run-python
    name: Ruff (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            webhook-server/pyproject.toml

      - name: Install Ruff
        working-directory: python
        run: pip install ruff

      - name: Ruff check (dalux-build)
        working-directory: python
        run: ruff check .

      - name: Ruff format --check (dalux-build)
        working-directory: python
        run: ruff format --check .

      - name: Ruff check (webhook-server)
        working-directory: webhook-server
        run: ruff check .

      - name: Ruff format --check (webhook-server)
        working-directory: webhook-server
        run: ruff format --check .

  mypy-python:
    if: inputs.run-python
    name: mypy (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            webhook-server/pyproject.toml

      # webhook-server's mypy config reaches dalux-build's source directly via
      # mypy_path (see webhook-server/pyproject.toml), so both installs are
      # needed here too, in the same order as test-webhook-server.
      - name: Install dalux-build (local, editable)
        working-directory: python
        run: pip install -e ".[dev,webhook]"

      - name: Install webhook-server
        working-directory: webhook-server
        run: pip install -e ".[dev]"

      - name: mypy (dalux-build)
        working-directory: python
        run: mypy -p dalux_build

      - name: mypy (webhook-server)
        working-directory: webhook-server
        run: mypy -p dalux_webhook

  test-webhook-server:
    if: inputs.run-python
    name: Test webhook server (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            webhook-server/pyproject.toml

      # Install the local (unreleased) python/ package editable *before*
      # webhook-server, so webhook-server's `dalux-build[webhook]>=X` pin is
      # satisfied by this checkout's code instead of pulling the published
      # PyPI package — otherwise this job would never catch a breaking change
      # to dalux_build before it ships.
      - name: Install dalux-build (local, editable)
        working-directory: python
        run: pip install -e ".[dev,webhook]"

      - name: Install webhook-server
        working-directory: webhook-server
        run: pip install -e ".[dev]"

      - name: Assert webhook-server is using the local dalux-build checkout
        run: |
          set -euo pipefail
          LOCATION=$(pip show -f dalux-build | grep -E '^Editable project location:' || true)
          if [ -z "$LOCATION" ]; then
            echo "dalux-build was not installed editable from ./python — webhook-server tests would run against PyPI, not this change." >&2
            exit 1
          fi
          echo "$LOCATION"

      - name: Run tests
        working-directory: webhook-server
        run: pytest
