name: dalux-platform

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: ${PLATFORM_DB_MIGRATOR_PASSWORD:?set PLATFORM_DB_MIGRATOR_PASSWORD}
      POSTGRES_DB: platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
