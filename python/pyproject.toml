[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dalux-build"
version = "2.3.0"
description = "Python client for the Dalux Build REST API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["dalux", "build", "api", "client", "construction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.34.2",
    "pydantic[email]>=2.13.4",
    "tqdm>=4.66.0",
    "fastapi>=0.141.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
dalux-skills = "dalux_build.ai.skills_cli:main"

[project.urls]
Homepage = "https://github.com/bruadam/dalux-build"
Repository = "https://github.com/bruadam/dalux-build"
Issues = "https://github.com/bruadam/dalux-build/issues"

[project.optional-dependencies]
ai = [
    "anthropic>=0.28.0",
    "mistralai>=0.0.11",
    "openai>=1.3.0",
    "pdf2image>=1.17.0",
    "pillow>=11.0.0",
]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
    "httpx2>=2.9.1",
    "twine>=6.0",
    "ipykernel>=7.3.0",
    "ruff>=0.14",
    "mypy>=1.15",
    "pre-commit>=4.6.1",
    "pandas>=2.0",
    "pandas-stubs>=2.3.3.260113",
    "types-tqdm>=4.70.0.20260731",
    "streamlit>=1.61.1",
    "plotly>=6.9.0",
    "platformdirs>=4",
    "PyYAML>=6",
]
dashboard = [
    "streamlit>=1.61.1",
    "plotly>=6.9.0",
]
webhook = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.52.0",
    "httpx>=0.27",
    "cryptography>=42",
    "croniter>=2",
]
rag = [
    "deepagents>=0.1",
    "langgraph-cli[inmem]>=0.2",
    "langchain[openai]>=0.3",
    "langchain-openrouter>=0.2.8",
    "langchain-mistralai>=0.2",
    "langchain-chroma>=0.2",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3",
    "chromadb>=0.5",
    "pypdf>=5",
    "platformdirs>=4",
    "PyYAML>=6",
    "firecrawl-py>=1",
    "langchain-mcp-adapters>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dalux_build*"]

[tool.setuptools.package-data]
dalux_build = ["py.typed", "ai/agent/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ANN",  # flake8-annotations (ANN401 is our "no explicit Any" gate for
             # dalux_build.models — mypy's disallow_any_explicit can't cover
             # that package, see the mypy override below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
# Aligned with project's requires-python = ">=3.12"
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_decorated = true
warn_unreachable = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_explicit = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Pydantic BaseModel subclasses trigger disallow_any_explicit errors due to
# mypy synthesizing __mypy-replace member with explicit Any (@dataclass_transform).
# This is a known Pydantic v2 + mypy strict mode limitation.
module = "dalux_build.models.*"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "dalux_build.webhook_server.models"
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Optional dependencies without type stubs
module = "anthropic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mistralai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdf2image"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "croniter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "holidays"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# AI provider integration deals with multiple LLM providers with different
# type signatures, making strict typing impractical
module = "dalux_build.ai.providers"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "dalux_build.models.files.models"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "deepagents.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_openrouter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_mistralai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_chroma.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_community.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_text_splitters.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_huggingface.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chromadb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "firecrawl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# RAG/deepagents integration deals with loosely-typed upstream packages,
# same rationale as the ai.providers override above.
module = "dalux_build.ai.agent.*"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "dalux_build.ai.rag.*"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "dalux_build.ai.reference.*"
warn_unused_ignores = false

[[tool.mypy.overrides]]
# langchain_core's @tool decorator has no type stubs (ignore_missing_imports
# above), which makes mypy treat it as returning Any; strict mode's
# disallow_any_decorated/disallow_untyped_decorators would otherwise flag
# every @tool-decorated function in this module.
module = "dalux_build.ai.agent.graph"
disallow_any_decorated = false
disallow_untyped_decorators = false
