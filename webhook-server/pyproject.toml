[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dalux-build-webhook-server"
version = "0.1.0"
description = "Scheduled Dalux Build file monitor with outbound webhooks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # fastapi/uvicorn/httpx now come from dalux-build's "webhook" extra, the
    # single source of truth for those pins (shared with the embedded
    # DaluxClient.webhook_server). Bump the lower bound to match whichever
    # dalux-build release first ships that extra.
    "dalux-build[webhook]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.14",
    "mypy>=1.15",
]

[project.scripts]
dalux-webhook-server = "dalux_webhook.__main__:main"

# During repository development, resolve the unreleased dalux-build package
# from this checkout instead of PyPI. Publishing/building still uses the
# standard dependency declared above; this table is uv-specific.
[tool.uv.sources]
"dalux-build" = { path = "../python", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["dalux_webhook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ANN",  # flake8-annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
# Pinned above this package's actual 3.10 floor (see [project] requires-python)
# because numpy's bundled stubs (pulled in transitively through dalux-build's
# optional pandas/to_dataframe() support) use PEP 695 `type` statements that
# mypy can only parse when targeting 3.12+. This setting only controls what
# mypy assumes is available while type-checking, not the supported runtime.
# setuptools' PEP 660 editable install for dalux-build uses an import-hook
# finder (not a plain path in a .pth file), which mypy's static import
# resolution can't follow — point it at the real source instead.
mypy_path = "../python"
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_decorated = true
warn_unreachable = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
# Pydantic BaseModel subclasses trigger false positive for disallow_any_explicit
module = "dalux_build.models.*"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "dalux_build.webhook_server.models"
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Optional dependencies without type stubs
module = "anthropic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mistralai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mistralai.client"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "croniter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "holidays"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdf2image"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# AI provider integration deals with multiple LLM providers with different
# type signatures, making strict typing impractical
module = "dalux_build.ai.providers"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "dalux_build.models.files.models"
warn_unused_ignores = false
