[global]
# Supabase project ID - will be set when linked to a project
project_id = ""
# API settings
api_port = 54321
api_hostname = "127.0.0.1"

[auth]
# Auth settings
site_url = "http://localhost:3000"
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"
anon_key = "super-secret-anon-key-with-at-least-32-characters-long"
service_role_key = "super-secret-service-role-key-with-at-least-32-characters-long"

[db]
# Database settings
host = "127.0.0.1"
port = 5432
user = "postgres"
password = "postgres"
database = "postgres"

[realtime]
# Realtime settings
enabled = true

[storage]
# Storage settings
file_size_limit = 52428800

[analytics]
# Analytics settings
enabled = true
